services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: skykin_db
    environment:
      POSTGRES_USER: ${DB_USER:-skykin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-skykin_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4
    container_name: skykin_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@skykin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5055:80"
    depends_on:
      - db

  # 3. Gin Backend (Go)
  backend:
    build:
      context: .
      dockerfile: deployments/docker/api.Dockerfile
    container_name: skykin_backend
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=release
      - DATABASE_URL=postgres://${DB_USER:-skykin_user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-skykin_db}?sslmode=disable
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-skykin_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-skykin_db}
      - PORT=8081
      # Optional: point at a host-run uvicorn (cd ml && uvicorn app:app --port 8000)
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://host.docker.internal:8000}
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-me}
    depends_on:
      - db
      - redis
    env_file:
      - .env
  redis:
    image: redis:7.2-alpine
    container_name: skykin-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: