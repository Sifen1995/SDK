services:
  # 1. PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: skykin_db
    environment:
      POSTGRES_USER: ${DB_USER:-skykin_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-skykin_db}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Wait until Postgres accepts connections AND PostGIS is installed in the app DB.
      # Fresh PostGIS images still load extensions after the first pg_isready succeeds.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM pg_extension WHERE extname='postgis'\" | grep -q 1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 45s

  adminer:
    image: adminer:4
    container_name: skykin_adminer
    ports:
      - "8082:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  # 3. Gin Backend (Go)
  backend:
    build:
      context: ../..
      dockerfile: deployments/docker/api.Dockerfile
    container_name: skykin_backend
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=release
      - DATABASE_URL=postgres://${DB_USER:-skykin_user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-skykin_db}?sslmode=disable
      - DB_HOST=db
      - DB_PORT=5432
      - PORT=8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ../../.env
  redis:
    image: redis:7.2-alpine
    container_name: skykin-redis
    command: redis-server --appendonly yes --requirepass your_secure_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: