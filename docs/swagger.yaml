securityDefinitions:
  APIKeyAuth:
    description: SDK publishable key (pk_live_...). Required for /api/v1 SDK routes.
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: Paste the JWT from POST /ad-portal/login (token field only, no "Bearer
      " prefix needed)
    in: header
    name: Authorization
    type: apiKey
  SDKSecretAuth:
    description: SDK secret key (sk_secret_...). Swagger UI uses this ONLY to auto-compute
      X-Signature (HMAC-SHA256 of the request body). The secret is stripped before
      the request is sent.
    in: header
    name: X-SDK-Secret
    type: apiKey
