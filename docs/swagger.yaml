        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
      security:
      - APIKeyAuth: []
        SDKSecretAuth: []
      summary: Ingest anonymous intent aggregates
