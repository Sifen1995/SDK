        with a non-SMS creative. Authorize with X-API-Key (pk_live_...) and X-SDK-Secret
        (sk_secret_...); Swagger UI auto-computes X-Signature.
      parameters:
      - description: Intent profile + optional channel + sms_consented
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_intents_interfaces_http.IngestIntentAdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_intents_interfaces_http.IngestIntentAdResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_intents_interfaces_http.IngestIntentAdAcceptedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
