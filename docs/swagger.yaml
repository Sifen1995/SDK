        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
