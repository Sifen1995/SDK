  /telemetry/anonymous-click:
    post:
      consumes:
      - application/json
      description: Accepts an anonymous click callback for a campaign using a signed
        token. The endpoint validates the token, queues the event for async billing
        processing, and returns 202 Accepted immediately.
      parameters:
      - description: Campaign ID
        in: query
        name: campaign_id
        required: true
        type: string
      - description: Signed click token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Track anonymous CPC click
      tags:
      - SDK - Bill Track
  /telemetry/sms/click:
    get:
      description: Public redirect endpoint embedded in SMS+ message bodies. Validates
        the signed tracking token, enqueues a click event to stream:billing_events
        (billing + delivery_log consumers write behind), and redirects to the campaign
        destination_url. No X-API-Key required.
      parameters:
      - description: Signed SMS click tracking token from sms_send_attempts
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "202":
          description: Accepted when destination_url is empty
        "302":
          description: Redirect to campaign destination_url
        "400":
          description: missing token
          schema:
            type: string
        "401":
          description: invalid sms click token
          schema:
            type: string
        "503":
          description: sms click tracking unavailable
          schema:
            type: string
      summary: Track SMS+ CTA click
      tags:
      - SDK - SMS+
  /telemetry/sms/debug/sends:
    get:
      description: Returns the latest SMS+ send attempts with masked phone numbers
        for demo/debug inspection. Authorize with X-API-Key (and X-SDK-Secret for
        POSTs; GET only needs the API key).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_delivery_http.SMSSendAttemptDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - APIKeyAuth: []
      summary: List recent SMS+ send attempts (demo)
      tags:
      - SDK - SMS+
  /telemetry/sms/twilio-status:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 'Public webhook for Twilio delivery receipts. Verifies X-Twilio-Signature,
        then updates sms_send_attempts status (sent/delivered/failed). Does not write
        billing_events. Mounted only when SMS_PROVIDER=twilio. Content-Type: application/x-www-form-urlencoded.'
      parameters:
      - description: Idempotent send key (campaign_id:pseudonymous_id)
        in: query
        name: send_key
        required: true
        type: string
      - description: Twilio message SID
        in: formData
        name: MessageSid
        type: string
      - description: Twilio status (queued|sent|delivered|undelivered|failed)
        in: formData
        name: MessageStatus
        required: true
        type: string
      - description: Twilio request signature
        in: header
        name: X-Twilio-Signature
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "204":
          description: Status recorded
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      summary: Twilio SMS status callback
      tags:
      - SDK - SMS+
  /telemetry/track:
    post:
      consumes:
      - application/json
      description: Accepts a consented ad tracking log (impression/click/install/signup/purchase).
        Impression/click events are deduplicated via Redis SETNX lock:telemetry:{pseudonymous_id}:{campaign_id}:{event_type}
        (impression 5m, click 1h) before XADD to stream:billing_events. Duplicates
        still return 202 without enqueueing. Install events require install_token.
        Authorize with X-API-Key and X-SDK-Secret.
      parameters:
      - description: Consented ad track payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.TelemetryTrackRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted — queued on stream:billing_events (or silently deduplicated)
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/skykin-platform_internal_platform_http.APIError'
      security:
      - APIKeyAuth: []
        SDKSecretAuth: []
      summary: Track consented ad billing event
      tags:
      - SDK - Bill Track
  /telemetry/track-anonymous:
    post:
      consumes:
      - application/json
      description: 'Accepts a minimal bill-track payload for non-consented users (campaign_id
        + event_type). Enqueues to Redis Stream stream:billing_events with source=anonymous
        and returns 202. Two independent consumer groups write behind: billing_processor_group
        → billing_events; delivery_log_processor_group → campaign_delivery_logs. Authorize
        with X-API-Key and X-SDK-Secret.'
